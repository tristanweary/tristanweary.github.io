<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tristan Weary Photography</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f8f9fa;
    }
    header {
      padding: 6rem 2rem 4rem;
      background-color: #ffffff;
      color: #000000;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    header h1 {
      font-size: 2.25rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin: 0;
    }
    .gallery {
      column-count: 4;
      column-gap: 1rem;
      padding: 1rem;
    }
    .gallery img {
      width: 100%;
      margin-bottom: 1rem;
      border-radius: 0.5rem;
      transition: opacity 0.3s;
      cursor: pointer;
    }
    .gallery img:hover {
      opacity: 0.7;
    }
    @media (max-width: 992px) {
      .gallery {
        column-count: 3;
      }
    }
    @media (max-width: 768px) {
      .gallery {
        column-count: 2;
      }
    }
    @media (max-width: 576px) {
      .gallery {
        column-count: 1;
      }
    }
    footer {
      background: #000;
      color: white;
      padding: 2rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1 class="ms-3">TRISTAN WEARY PHOTOGRAPHY</h1>
  
<div class="gallery" id="gallery"></div>

  <!-- Modal -->
  <div class="modal fade" id="imageModal" tabindex="-1" aria-labelledby="imageModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content bg-transparent border-0">
        <div class="modal-body p-0 position-relative text-center">
  <button id="prevBtn" class="btn btn-dark position-absolute top-50 start-0 translate-middle-y z-2" style="opacity: 0.3; transition: opacity 0.3s;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.3'">&#10094;</button>
  <img id="modalImage" src="" alt="" class="img-fluid rounded mx-auto d-block" style="width: 90vw; height: 90vh; object-fit: contain;">
  <button id="nextBtn" class="btn btn-dark position-absolute top-50 end-0 translate-middle-y z-2" style="opacity: 0.3; transition: opacity 0.3s;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.3'">&#10095;</button>
</div>
      </div>
    </div>
  </div>

  <footer>
    &copy; 2025 Tristan Weary Photography
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const imagePaths = [
    'jamie_8688.jpg', '_DSC4982_COLLAGE2.jpg', 'lisa_highkey.jpg', 'crimelight.jpg', 'pistil_0802.jpg',
    'chadd_1534.jpg', 'LLB_4164dess.jpg', 'DSC_9359.jpg', '_LLB4958.jpg', 'auxum.png',
    'DSC_0604.jpg', 'DSC_0744.jpg', '_DSC5210.jpg','_DSC3641.jpg','DSC_2231-Recovered_abigail.jpg','LLB_2679b.jpg','LLB_3985bw.jpb',
    'DZM_1818.jpg','LLB_3834_crop_2.jpg','skull_collage1_high_saturation.jpg','DZM_2635(2).jpg','jules1.jpg','ken1.jpg'
  ];
  const shuffled = imagePaths.sort(() => Math.random() - 0.5);
  const gallery = document.getElementById('gallery');
  shuffled.forEach(name => {
    const img = document.createElement('img');
    img.src = `img/${name}`;
    img.alt = '';
    img.setAttribute('data-bs-toggle', 'modal');
    img.setAttribute('data-bs-target', '#imageModal');
    gallery.appendChild(img);
  });
</script>
<script>
  const galleryImages = Array.from(document.querySelectorAll('.gallery img'));
  const modalImage = document.getElementById('modalImage');
  let currentIndex = 0;

  const updateModalImage = () => {
    modalImage.src = galleryImages[currentIndex].src;
  };

  document.querySelector('.gallery').addEventListener('click', function(e) {
    if (e.target.tagName === 'IMG') {
      currentIndex = galleryImages.indexOf(e.target);
      updateModalImage();
    }
  });

  document.getElementById('prevBtn').addEventListener('click', () => {
    currentIndex = (currentIndex - 1 + galleryImages.length) % galleryImages.length;
    updateModalImage();
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    currentIndex = (currentIndex + 1) % galleryImages.length;
    updateModalImage();
  });
</script>
  <script>
    const gallery = document.querySelector('.gallery');
    const modalImage = document.getElementById('modalImage');

    gallery.addEventListener('click', function(e) {
      if (e.target.tagName === 'IMG') {
        modalImage.src = e.target.src;
      }
    });
  </script>

</body>
</html>
